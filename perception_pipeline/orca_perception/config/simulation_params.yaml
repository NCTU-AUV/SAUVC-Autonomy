# perception_params.yaml
# Central configuration for the SAUVC AUV perception pipeline.
# Pass a custom path via:
#   ros2 launch orca_perception perception.launch.py config_file:=/path/to/params.yaml

# ── Launch-level flags (read by the launch file, not passed as ROS params) ────
launch:
  use_viz: false

# ── Model profile selection ──────────────────────────────────────────────────
# Use "qualification" for QualificationMission, "finals" for FinalMission.
model_profile: finals

model_profiles:
  finals:
    model_file_path: /workspaces/isaac_ros-dev/src/model/finals.onnx
    engine_file_path: /workspaces/isaac_ros-dev/src/model/finals.plan
    num_classes: 7
    class_names:
      - blue_drum
      - blue_flare
      - gate
      - orange_flare
      - red_drum
      - red_flare
      - yellow_flare
  qualification:
    model_file_path: /workspaces/isaac_ros-dev/src/model/qualification.onnx
    engine_file_path: /workspaces/isaac_ros-dev/src/model/qualification.plan
    num_classes: 1
    class_names:
      - gate

# ── Class label mapping (index = class id) ────────────────────────────────────
# Fallback used by BOTH depth_perception and yolov8_visualizer when no
# model_profiles entry is selected.
# SAUVC YOLOv8 model (7 classes):
class_names:
  - blue_drum
  - blue_flare
  - gate
  - orange_flare
  - red_drum
  - red_flare
  - yellow_flare

# ── DNN image encoder (values forwarded as launch_arguments, not ros__parameters) ──
dnn_image_encoder:
  input_image_width: 640
  input_image_height: 640
  network_image_width: 640
  network_image_height: 640
  image_mean: "[0.0, 0.0, 0.0]"
  image_stddev: "[1.0, 1.0, 1.0]"

# ── TensorRT inference node ────────────────────────────────────────────────────
/tensor_rt:
  ros__parameters:
    model_file_path: /workspaces/isaac_ros-dev/src/model/finals.onnx
    engine_file_path: /workspaces/isaac_ros-dev/src/model/finals.plan
    force_engine_update: false
    output_binding_names: ["output0"]
    output_tensor_names: ["output_tensor"]
    input_tensor_names: ["input_tensor"]
    input_binding_names: ["images"]
    verbose: false

# ── YOLOv8 decoder node ────────────────────────────────────────────────────────
/yolov8_decoder_node:
  ros__parameters:
    confidence_threshold: 0.25
    nms_threshold: 0.45
    num_classes: 7

# ── Camera selector node ───────────────────────────────────────────────────────
/camera_selector_node:
  ros__parameters:
    realsense_image_topic: /$(ns)/color/image_raw
    realsense_info_topic:  /$(ns)/color/camera_info
    usb_image_topic:       /$(ns)/camera/bottom/image_raw
    usb_info_topic:        /$(ns)/camera/bottom/camera_info
    mode_topic:            /orca/decision/camera_mode
    selected_image_topic:  /orca/selected/image_raw
    selected_info_topic:   /orca/selected/camera_info
    default_mode:          realsense

# ── Depth perception node ──────────────────────────────────────────────────────
/depth_perception:
  ros__parameters:
    # --- Input topics ---
    depth_image_topic:        /$(ns)/depth/image_raw
    camera_info_topic:        /$(ns)/depth/camera_info   # intrinsics read at runtime
    detections_topic:         /detections_output
    mode_topic:               /orca/decision/camera_mode

    # --- Output topic (consumed by decision node) ---
    perception_output_topic:  /orca/perception_array

    # --- YOLO tensor dimensions ---
    yolo_input_width:  640
    yolo_input_height: 640

    # --- Depth estimation thresholds ---
    depth_min_range:        0.2     # metres — discard depth readings below this
    gate_symmetry_thresh:   1.5     # max left/right depth asymmetry for gate (m)
    gate_width_min_ratio:   0.6     # gate column span must be > this fraction of bbox width
    gate_col_step:          2       # pixel step between sampled columns
    gate_col_min_samples:   5       # minimum valid columns to accept gate estimate
    gate_col_min_points:    30      # minimum depth pixels in a column to use it
    obj_center_crop_ratio:  0.5     # fraction of bbox used for centre-crop sampling
    obj_percentile:         10      # depth percentile used for foreground estimation
    obj_min_roi_points:     5       # minimum valid depth pixels to trust estimate

    # --- Multi-frame stability tracker ---
    stability_window:         6     # rolling window length (frames)
    stability_min_hits:       2     # min detections in window to be considered stable
    stability_pos_std_thresh: 0.30  # max position std-dev (m) over window
    stability_conf_thresh:    0.25  # min confidence to count toward stability

# ── Depth perception viz node (only active when use_viz: true) ────────────────
/depth_perception_viz:
  ros__parameters:
    viz_image_topic:      /yolov8_processed_image
    viz_perception_topic: /orca/perception_array
    viz_native_width:     1280
    viz_native_height:    720

# ── Depth bag render (only active when record_images:=true) ───────────────────
# Depth goes into the bag as a picture, not as measurements — the same
# grayscale render the GUI's DEPTH panel shows, JPEG'd. Raw 32FC1 measured
# 35.94 MB/s and dominated the bag; this measures 0.30 MB/s, 123x smaller.
#
# depth_image_topic is not listed: perception.launch.py passes
# /depth_perception's, so sim/real stays resolved in one place.
/depth_record:
  ros__parameters:
    min_depth_m:   0.0    # near end of the grayscale ramp (black)
    max_depth_m:  10.0    # far end (white). Matches the GUI. The pool runs to
                          # ~16 m, so the far wall saturates — raise this if a
                          # run needs readable background, at the cost of
                          # near-field contrast.
    jpeg_quality:   80
