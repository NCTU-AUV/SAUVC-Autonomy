decision_node:
  ros__parameters:
    # Wrench Controller Parameters
    k_surge: 0.8
    k_sway: 0.8
    k_yaw: 0.3
    motion_lowpass_alpha: 0.2

    # World Model Parameters
    max_velocity_clamp: 1.5
    perception_timeout_sec: 1.0
    velocity_decay: 0.95

    # Mission Parameters
    tree_xml_file: "config/trees.xml"
    main_tree_id: "FinalMission"

    # /orca/decision/status_json 的發布頻率（Hz）。這是 DecisionStatus 的 JSON
    # 鏡像，給 control 容器的 Web GUI 用 —— 那邊沒有 orca_interface，反序列化
    # 不了原本的訊息。從 50 Hz 的 wrench loop 抽取，設 0 可完全關掉。
    status_json_rate_hz: 5.0

    # Camera switching hysteresis
    camera_switch_hysteresis: 0.5

    # Thresholds
    align_yaw_threshold: 0.1
    align_distance_threshold: 0.5

    # MoveAboveTarget
    move_above_k_surge: 0.06
    move_above_k_sway: 0.02
    move_above_max_surge: 15.0
    move_above_max_sway: 5.0
    move_above_reacquire_surge: 5.0
    move_above_center_threshold: 20.0
    move_above_stable_frames: 10
    move_above_timeout_sec: 150.0
    move_above_lowpass_alpha: 0.3

    # 偵測影像中心（像素）。偵測值在 640x640 的 YOLO 張量空間，所以中心是
    # (320, 320)，而且前後相機共用同一個中心。舊的 bottom_cam_center_y: 240
    # 只對 640x480 成立，會讓每一次投球都固定偏 80 px。
    image_center_x: 320.0
    image_center_y: 320.0

    # CheckBottomClear
    check_bottom_clear_surge_speed: 15.0
    check_bottom_clear_stable_frames: 15
    check_bottom_clear_timeout_sec: 40.0
    check_bottom_clear_center_deadband: 20.0

    # BumpFlare
    # ApproachTarget 停在離柱 1.0 m，surge 25 撞過去用不到 15 秒；多出來的時間
    # 是「撞完繼續往前衝」，往對面池壁去（碰壁 −5/次，5 次自動 abort）。三根柱
    # 子就是三次撞牆機會，所以砍到 5 秒。
    # 這一行現在是「呼叫端沒在 XML 指定 timeout 時」的後備值。優先序已經翻正
    # （bump_flare.cpp）：XML 的 timeout port 優先，沒寫才落回這裡。撞柱那三個
    # 呼叫端都在 trees.xml 明寫 timeout="5.0"，所以改這一行不會影響它們。
    bump_flare_surge: 25.0
    bump_flare_timeout_sec: 5.0

    # WaitForFlareOrder
    # 規則是過門成功「之後」才告知順序：裁判判定 → 公布 → 隊員看板子 → 輸入 →
    # 送出 → 訊號傳到水下。原本的 5.0 秒不可能等到，而逾時只留一行 WARN 就靜默
    # 改用 default_order，現場看不出異常，艇照樣去撞柱、只是順序錯 —— 60 分順序
    # 獎金就這樣丟掉。
    #
    # default_order 一定要留著（不要設成空字串）：解析結果為空時
    # wait_for_flare_order.cpp:98-103 回 FAILURE，而 trees.xml 的
    # <SubTree ID="CommunicationTask"/> 是裸的、沒有 Fallback 接住，FAILURE 會一路
    # 往上讓 FinalMission 的主 Sequence 失敗 → 最外層 ReactiveFallback 兩個分支
    # 全滅 → FinishMission 永遠不執行、艇不上浮，連 5 分結束獎勵和時間獎勵一起賠掉。
    # 亂猜順序至少還有機會拿到每根 20 分的撞柱分。
    wait_for_flare_order_timeout_sec: 5.0
    wait_for_flare_order_default_order: "rby"

    # GoToPose
    go_to_pose_surge: 0.3
    go_to_pose_threshold: 1.0
    go_to_pose_timeout_sec: 30.0

    # SearchBottomTarget
    search_bottom_yaw_speed: 0.2
    search_bottom_timeout_sec: 30.0

    # SpiralSearch
    spiral_search_timeout_sec: 45.0

    # Actuator timing
    drop_ball_wait_sec: 0.5
    actuator_wait_sec: 1.0
